# Full gate: shared + server + client builds, server suites
# (unit, 21-game sim, live socket regression) and client vitest.
# Deterministic seeds throughout — safe to run on every push.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
